<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atrodi horizontu un satekpunktu</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#3a3338;overflow:hidden;font-family:Candara,"Segoe UI",Calibri,Arial,sans-serif;color:#2a2227;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#FCFCFB;display:flex;flex-direction:column;overflow:hidden}
#hd{display:flex;align-items:center;gap:1.2em;padding:.55em 1.2em;background:#8a1b46;color:#fff;flex:none;height:4.6em}
#hd h1{font-size:1.75em;font-weight:700;white-space:nowrap}
#hd .sub{font-size:.95em;opacity:.85;white-space:nowrap}
#tabs{display:flex;gap:.5em;margin-left:auto}
.tab{font:inherit;font-size:1em;font-weight:700;padding:.45em 1em;border-radius:2em;border:.12em solid rgba(255,255,255,.7);background:transparent;color:#fff;cursor:pointer}
.tab.on{background:#fff;color:#8a1b46}
#score{font-size:1.05em;font-weight:700;background:rgba(255,255,255,.16);padding:.4em .9em;border-radius:.6em;white-space:nowrap}
#main{flex:1;position:relative;min-height:0;padding:.9em 1.2em .6em}
#ft{flex:none;height:3.9em;display:flex;align-items:center;gap:.8em;padding:.4em 1.2em;background:#efecea;border-top:.1em solid #dcd7d3}
#msg{flex:1;font-size:1.15em;line-height:1.2;padding:.35em .8em;border-radius:.5em;min-height:2.5em;display:flex;align-items:center;background:#fff;border:.1em solid #dcd7d3}
#msg.ok{background:#e3f3e8;border-color:#2e7d4f;color:#17512f}
#msg.no{background:#fde8e6;border-color:#b3261e;color:#7d1610}
.btn{font:inherit;font-size:1.05em;font-weight:700;padding:.55em 1.1em;border-radius:.55em;border:.12em solid #8a1b46;background:#fff;color:#8a1b46;cursor:pointer;white-space:nowrap}
.btn.pri{background:#8a1b46;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.97)}
#fs{background:#2a2227;border-color:#2a2227;color:#fff}
.panel{background:#fff;border:.1em solid #dcd7d3;border-radius:.8em}
.ovl{position:absolute;inset:0;background:rgba(42,34,39,.72);display:none;align-items:center;justify-content:center;z-index:9000}
.ovl.on{display:flex}
.ovl .box{background:#fff;border-radius:1em;padding:1.6em 2em;max-width:70%;max-height:82%;overflow:auto;font-size:1.15em;line-height:1.35}
.ovl h2{color:#8a1b46;margin-bottom:.5em;font-size:1.6em}
.ovl li{margin:.3em 0 .3em 1.2em;font-size:.82em}
.ovl p{margin:.4em 0}
/* sort */
.sort{display:grid;grid-template-columns:27% 1fr;grid-template-rows:1fr auto;gap:.8em;height:100%}
.sort .view{grid-row:1;display:flex;flex-direction:column;padding:.6em;min-height:0}
.view .pic{flex:1;min-height:0;background:#f3f1ef center/contain no-repeat;border-radius:.5em}
.view .cap{font-size:1.05em;line-height:1.2;padding:.45em .2em 0;min-height:2.9em;color:#4a4046}
.sort .bins{display:grid;gap:.8em;min-height:0}
.bin{border:.18em dashed #b9a9b1;border-radius:.8em;background:#faf7f8;display:flex;flex-direction:column;min-height:0;padding:.5em;cursor:pointer}
.bin.hot{border-color:#8a1b46;background:#f6e9ef}
.bin h3{font-size:1.3em;color:#8a1b46;text-align:center;line-height:1.1}
.bin .d{font-size:.85em;text-align:center;color:#5c5157;margin:.15em 0 .3em;line-height:1.15}
.bin .got{flex:1;display:grid;gap:.35em;align-content:start;min-height:0;overflow-y:auto}
.rw{display:flex;gap:.5em;align-items:center;background:#fff;border:.1em solid #cfe5d6;border-radius:.4em;padding:.25em;cursor:zoom-in;min-width:0}
.rw i{flex:none;width:5.4em;height:4em;border-radius:.3em;background:#eee center/cover}
.rw div{min-width:0;font-size:.82em;line-height:1.15}
.rw b{display:block;color:#2a2227}
.rw span{color:#4a4046}

.tray{grid-column:1/3;display:grid;gap:.5em;padding:.5em;background:#efecea;border-radius:.8em}
.card,.item,.ghost{touch-action:none}
.card{aspect-ratio:4/3;border-radius:.45em;background:#ddd center/cover;border:.2em solid #fff;box-shadow:0 .1em .4em rgba(0,0,0,.25);cursor:grab;position:relative}
.card.sel{border-color:#8a1b46;box-shadow:0 0 0 .22em #8a1b46}
.card.done{visibility:hidden}
.card.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-.5em)}75%{transform:translateX(.5em)}}
.ghost{position:fixed;pointer-events:none;z-index:99;opacity:.9;border-radius:.4em;box-shadow:0 .4em 1.2em rgba(0,0,0,.4);background:#ddd center/cover}
/* quiz */
.quiz{display:grid;grid-template-columns:52% 1fr;gap:1em;height:100%}
.quiz .pic{background:#f3f1ef center/contain no-repeat;border-radius:.8em;border:.1em solid #dcd7d3;min-height:0;position:relative;overflow:hidden}
.quiz .pic>svg,.quiz .pic>canvas{position:absolute;inset:0;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:.6em;min-height:0}
.q{font-size:1.5em;font-weight:700;line-height:1.2;color:#2a2227}
.ctx{font-size:1.1em;line-height:1.25;color:#4a4046}
.opts{display:grid;gap:.55em;margin-top:auto}
.opt{font:inherit;font-size:1.25em;text-align:left;padding:.6em .9em;border-radius:.6em;border:.14em solid #b9a9b1;background:#fff;cursor:pointer;line-height:1.15;color:#2a2227}
.opt.ok{background:#e3f3e8;border-color:#2e7d4f;font-weight:700}
.opt.no{background:#fde8e6;border-color:#b3261e;opacity:.75}
.opt.dim{opacity:.45}
.prog{font-size:1em;color:#6b6066;font-weight:700}
.teams{display:flex;gap:.5em;flex-wrap:wrap}
.team{padding:.3em .8em;border-radius:.5em;background:#efecea;font-weight:700;font-size:1.05em;border:.14em solid transparent}
.team.cur{border-color:#8a1b46;background:#f6e9ef;color:#8a1b46}
/* order */
.order{display:flex;flex-direction:column;gap:.7em;height:100%}
.order .task{font-size:1.4em;font-weight:700;line-height:1.2}
.slots,.pool{display:grid;gap:.7em;flex:1;min-height:0}
.slot{border:.18em dashed #b9a9b1;border-radius:.7em;background:#faf7f8;position:relative;min-height:0;display:flex;align-items:stretch;justify-content:center;cursor:pointer}
.slot>b{position:absolute;left:.4em;top:.2em;font-size:1.3em;color:#8a1b46;z-index:2;background:rgba(255,255,255,.85);border-radius:.3em;padding:0 .3em}
.slot.ok{border:.22em solid #2e7d4f}.slot.no{border:.22em solid #b3261e}
.item{border-radius:.55em;background:#fff center/contain no-repeat;border:.16em solid #dcd7d3;cursor:grab;width:100%;min-height:0;position:relative;overflow:hidden}
.item.sel{border-color:#8a1b46;box-shadow:0 0 0 .2em #8a1b46}
.item>svg,.item>canvas,.item>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pool{background:#efecea;border-radius:.8em;padding:.6em}
.pool .cell{min-height:0;display:flex}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;text-align:center;padding:2em 12%}
.start h2{font-size:2.4em;color:#8a1b46}.start p{font-size:1.4em;line-height:1.3}
.row{display:flex;gap:.6em;align-items:center;justify-content:center;flex-wrap:wrap}

.stack .rw{flex-direction:column;align-items:stretch;gap:.2em}
.stack .rw i{width:100%;height:5.2em}
.stack .rw div{font-size:.78em}
</style></head><body>

 {img:I('v_2vp'),ar:960/540,pl:.25,pr:.25,hy:40.7,vp:[-7.7,107.7],tol:6,L:[[0,50,3],[0,50,62],[1,50,3],[1,50,62]],say:'Māja redzama no stūra, tāpēc tai ir divi satekpunkti: viens kreisās sienas līnijām, otrs – labās. Abi atrodas uz horizonta, bet ārpus paša attēla.'},

function run(m){let i=0;const solved=new Set();m.style.cssText+=';display:grid;grid-template-rows:1fr 7.2em;gap:.7em';
 const top=el('div'),strip=el('div');top.style.cssText='display:grid;grid-template-columns:1fr 26em;gap:1.2em;min-height:0';strip.style.cssText='display:grid;grid-template-columns:repeat('+PH.length+',1fr);gap:.6em;background:#efecea;border-radius:.7em;padding:.5em';m.append(top,strip);
 const thumbs=PH.map((F,j)=>{const t=el('div');t.style.cssText='position:relative;border-radius:.4em;background:center/cover;cursor:pointer;border:.25em solid #fff;box-shadow:0 .1em .3em rgba(0,0,0,.25)';bgi(t,F.img);t.innerHTML='<b style="position:absolute;left:.3em;top:.2em;background:rgba(255,255,255,.9);color:#8a1b46;border-radius:.3em;padding:0 .35em">'+(j+1)+'</b><span class="ok" style="position:absolute;right:.3em;top:.2em;background:#2e7d4f;color:#fff;border-radius:50%;width:1.5em;height:1.5em;display:none;align-items:center;justify-content:center;font-weight:700">✓</span>';t.onclick=()=>{i=j;go()};strip.appendChild(t);return t});
 const go=()=>{top.innerHTML='';thumbs.forEach((t,j)=>{t.style.borderColor=j===i?'#8a1b46':'#fff';$('.ok',t).style.display=solved.has(j)?'flex':'none'});
  const F=PH[i],pl=F.pl||0,pr=F.pr||0,T=1+pl+pr,ar=F.ar*T,X=x=>(pl+x/100)/T*100,Ximg=d=>(d/100*T-pl)*100;
  const box=el('div');box.style.cssText='display:flex;align-items:center;justify-content:center;min-height:0;min-width:0';
  const pic=el('div');pic.style.cssText='position:relative;aspect-ratio:'+ar+';'+(ar>1.5?'width:100%':'height:100%')+';max-width:100%;max-height:100%;background-color:#e9e7e4;background-repeat:no-repeat;background-size:'+100/T+'% 100%;background-position:'+(pl+pr?pl/(pl+pr)*100:50)+'% 0;border-radius:.5em;overflow:hidden;touch-action:none';bgi(pic,F.img);box.appendChild(pic);const side=el('div','side');top.append(box,side);App.score('Attēls '+(i+1)+' no '+PH.length);
  pic.innerHTML='<svg id="sv" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg>';
  const hl=el('div');let hy=12,step=1;hl.style.cssText='position:absolute;left:0;right:0;height:2.6em;margin-top:-1.3em;cursor:ns-resize;z-index:5';hl.innerHTML='<div style="position:absolute;left:0;right:0;top:50%;border-top:.25em solid #f2c200;box-shadow:0 0 .2em #000"></div><span style="position:absolute;left:.3em;top:50%;transform:translateY(-50%);background:#f2c200;font-weight:700;padding:.1em .5em;border-radius:.3em">↕ horizonts</span>';pic.appendChild(hl);
  const two=F.vp.length>1,vps=F.vp.map((v,j)=>{const d=el('div');d._x=two?(j?62:38):12;d.style.cssText='position:absolute;width:3em;height:3em;margin:-1.5em;border-radius:50%;border:.3em solid '+(j?'#1f6fe0':'#e02020')+';background:rgba(255,255,255,.55);cursor:ew-resize;z-index:6;display:none;box-shadow:0 0 .3em #000';pic.appendChild(d);return d});
  const put=()=>{hl.style.top=hy+'%';vps.forEach(d=>{d.style.top=hy+'%';d.style.left=d._x+'%'})};put();
  const dragf=(n,f)=>n.addEventListener('pointerdown',e=>{e.preventDefault();const r=pic.getBoundingClientRect(),mv=v=>{f((v.clientX-r.left)/r.width*100,(v.clientY-r.top)/r.height*100);put()},up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)});
  dragf(hl,(x,y)=>{if(step===1)hy=Math.max(2,Math.min(98,y))});vps.forEach(d=>dragf(d,x=>{if(step===2)d._x=Math.max(1,Math.min(99,x))}));
  const showSolved=()=>{step=3;hy=F.hy;hl.style.cursor='default';const tg=F.vp.map(X);vps.forEach((d,j)=>{d._x=tg[j];d.style.display='';d.style.cursor='default'});put();
   $('#sv',pic).innerHTML=F.L.map(l=>'<line x1="'+tg[l[0]]+'" y1="'+F.hy+'" x2="'+X(l[1])+'" y2="'+l[2]+'" stroke="'+(l[0]?'#1f6fe0':'#e02020')+'" vector-effect="non-scaling-stroke" style="stroke-width:.22em"/>').join('');
   side.innerHTML='<div class="prog">Atrisināts</div><div class="q">'+(two?'Horizonts un divi satekpunkti':'Horizonts un satekpunkts')+'</div><div class="ctx" style="font-size:1.15em"><b>Ko stāsta attēls?</b> '+F.say+'</div><div class="row" style="margin-top:auto;justify-content:space-between"><button class="btn" id="re">↻ Mēģināt vēlreiz</button>'+(i<PH.length-1?'<button class="btn pri" id="nx">Nākamais attēls →</button>':'')+'</div>';
   $('#re',side).onclick=()=>{solved.delete(i);go()};if($('#nx',side))$('#nx',side).onclick=()=>{i++;go()};thumbs.forEach((t,j)=>$('.ok',t).style.display=solved.has(j)?'flex':'none')};
  const s1=()=>{side.innerHTML='<div class="prog">1. solis no 2</div><div class="q">Kur ir horizonts?</div><div class="ctx">Pavelc dzelteno līniju līdz augstumam, kurā saiet kopā līnijas, kas attālinās. Tas ir skatītāja acu augstums.</div><div class="row" style="margin-top:auto;justify-content:flex-end"><button class="btn pri" id="ok">Pārbaudīt</button></div>';App.msg('Velc dzelteno līniju uz augšu vai uz leju. Apakšā vari izvēlēties jebkuru attēlu.');
   $('#ok',side).onclick=()=>{if(Math.abs(hy-F.hy)<=4.5){hy=F.hy;step=2;vps.forEach(d=>d.style.display='');put();hl.style.cursor='default';App.msg('<b>Pareizi!</b>&nbsp;Tagad atrodi '+(two?'abus satekpunktus.':'satekpunktu.'),'ok');s2()}else App.msg('<b>Vēl ne.</b>&nbsp;Horizonts ir '+(hy<F.hy?'zemāk':'augstāk')+'. Meklē augstumu, kurā tālumā saiet kopā ceļa, sienu vai jumta līnijas.','no')}};
  const s2=()=>{side.innerHTML='<div class="prog">2. solis no 2</div><div class="q">'+(two?'Kur ir abi satekpunkti?':'Kur ir satekpunkts?')+'</div><div class="ctx">'+(two?'Bīdi sarkano un zilo apli pa horizontu līdz vietām, kur saiet kopā katras sienas līnijas. Satekpunkts var būt arī ārpus attēla – pelēkajā laukumā.':'Satekpunkts atrodas uz horizonta. Bīdi sarkano apli līdz vietai, kur saiet kopā līnijas, kas attālinās.')+'</div><div class="row" style="margin-top:auto;justify-content:flex-end"><button class="btn pri" id="ok">Pārbaudīt</button></div>';
   $('#ok',side).onclick=()=>{const tol=F.tol||5.5,xs=vps.map(d=>Ximg(d._x)).sort((a,b)=>a-b),bad=F.vp.findIndex((t,j)=>Math.abs(xs[j]-t)>tol);
    if(bad<0){solved.add(i);showSolved();App.msg('<b>Pareizi!</b>&nbsp;Krāsainās līnijas rāda, kā telpas līnijas saiet kopā satekpunktā.','ok');if(solved.size===PH.length)App.msg('<b>Visi attēli atrisināti.</b>&nbsp;Apakšā vari atvērt jebkuru attēlu un salīdzināt. Augsts horizonts – skats no augšas, zems horizonts – skats no apakšas.','ok')}
    else App.msg('<b>Vēl ne.</b>&nbsp;'+(two?(bad?'Labais':'Kreisais')+' satekpunkts ir vairāk pa '+(xs[bad]<F.vp[bad]?'labi':'kreisi')+'.':'Satekpunkts ir vairāk pa '+(xs[0]<F.vp[0]?'labi':'kreisi')+'.')+' Pieliec lineālu pie sienas vai ceļa malas un paskaties, kur tā aizved.','no')}};
  solved.has(i)?showSolved():s1()};go()}
App.init({title:'Atrodi horizontu un satekpunktu',sub:'6. klase · 6.5. Perspektīvas radošs pielietojums',note:'Divi pēdējie attēli ar mājām ir datorā aprēķināti, tāpēc to satekpunkti ir precīzi.',parts:[{name:'Horizonts un satekpunkts',mount:run}]});
