<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>No dabas līdz zīmei</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#3a3338;overflow:hidden;font-family:Candara,"Segoe UI",Calibri,Arial,sans-serif;color:#2a2227;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#FCFCFB;display:flex;flex-direction:column;overflow:hidden}
#hd{display:flex;align-items:center;gap:1.2em;padding:.55em 1.2em;background:#8a1b46;color:#fff;flex:none;height:4.6em}
#hd h1{font-size:1.75em;font-weight:700;white-space:nowrap}
#hd .sub{font-size:.95em;opacity:.85;white-space:nowrap}
#tabs{display:flex;gap:.5em;margin-left:auto}
.tab{font:inherit;font-size:1em;font-weight:700;padding:.45em 1em;border-radius:2em;border:.12em solid rgba(255,255,255,.7);background:transparent;color:#fff;cursor:pointer}
.tab.on{background:#fff;color:#8a1b46}
#score{font-size:1.05em;font-weight:700;background:rgba(255,255,255,.16);padding:.4em .9em;border-radius:.6em;white-space:nowrap}
#main{flex:1;position:relative;min-height:0;padding:.9em 1.2em .6em}
#ft{flex:none;height:3.9em;display:flex;align-items:center;gap:.8em;padding:.4em 1.2em;background:#efecea;border-top:.1em solid #dcd7d3}
#msg{flex:1;font-size:1.15em;line-height:1.2;padding:.35em .8em;border-radius:.5em;min-height:2.5em;display:flex;align-items:center;background:#fff;border:.1em solid #dcd7d3}
#msg.ok{background:#e3f3e8;border-color:#2e7d4f;color:#17512f}
#msg.no{background:#fde8e6;border-color:#b3261e;color:#7d1610}
.btn{font:inherit;font-size:1.05em;font-weight:700;padding:.55em 1.1em;border-radius:.55em;border:.12em solid #8a1b46;background:#fff;color:#8a1b46;cursor:pointer;white-space:nowrap}
.btn.pri{background:#8a1b46;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.97)}
#fs{background:#2a2227;border-color:#2a2227;color:#fff}
.panel{background:#fff;border:.1em solid #dcd7d3;border-radius:.8em}
.ovl{position:absolute;inset:0;background:rgba(42,34,39,.72);display:none;align-items:center;justify-content:center;z-index:9000}
.ovl.on{display:flex}
.ovl .box{background:#fff;border-radius:1em;padding:1.6em 2em;max-width:70%;max-height:82%;overflow:auto;font-size:1.15em;line-height:1.35}
.ovl h2{color:#8a1b46;margin-bottom:.5em;font-size:1.6em}
.ovl li{margin:.3em 0 .3em 1.2em;font-size:.82em}
.ovl p{margin:.4em 0}
/* sort */
.sort{display:grid;grid-template-columns:27% 1fr;grid-template-rows:1fr auto;gap:.8em;height:100%}
.sort .view{grid-row:1;display:flex;flex-direction:column;padding:.6em;min-height:0}
.view .pic{flex:1;min-height:0;background:#f3f1ef center/contain no-repeat;border-radius:.5em}
.view .cap{font-size:1.05em;line-height:1.2;padding:.45em .2em 0;min-height:2.9em;color:#4a4046}
.sort .bins{display:grid;gap:.8em;min-height:0}
.bin{border:.18em dashed #b9a9b1;border-radius:.8em;background:#faf7f8;display:flex;flex-direction:column;min-height:0;padding:.5em;cursor:pointer}
.bin.hot{border-color:#8a1b46;background:#f6e9ef}
.bin h3{font-size:1.3em;color:#8a1b46;text-align:center;line-height:1.1}
.bin .d{font-size:.85em;text-align:center;color:#5c5157;margin:.15em 0 .3em;line-height:1.15}
.bin .got{flex:1;display:grid;gap:.35em;align-content:start;min-height:0;overflow-y:auto}
.rw{display:flex;gap:.5em;align-items:center;background:#fff;border:.1em solid #cfe5d6;border-radius:.4em;padding:.25em;cursor:zoom-in;min-width:0}
.rw i{flex:none;width:5.4em;height:4em;border-radius:.3em;background:#eee center/cover}
.rw div{min-width:0;font-size:.82em;line-height:1.15}
.rw b{display:block;color:#2a2227}
.rw span{color:#4a4046}

.tray{grid-column:1/3;display:grid;gap:.5em;padding:.5em;background:#efecea;border-radius:.8em}
.card,.item,.ghost{touch-action:none}
.card{aspect-ratio:4/3;border-radius:.45em;background:#ddd center/cover;border:.2em solid #fff;box-shadow:0 .1em .4em rgba(0,0,0,.25);cursor:grab;position:relative}
.card.sel{border-color:#8a1b46;box-shadow:0 0 0 .22em #8a1b46}
.card.done{visibility:hidden}
.card.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-.5em)}75%{transform:translateX(.5em)}}
.ghost{position:fixed;pointer-events:none;z-index:99;opacity:.9;border-radius:.4em;box-shadow:0 .4em 1.2em rgba(0,0,0,.4);background:#ddd center/cover}
/* quiz */
.quiz{display:grid;grid-template-columns:52% 1fr;gap:1em;height:100%}
.quiz .pic{background:#f3f1ef center/contain no-repeat;border-radius:.8em;border:.1em solid #dcd7d3;min-height:0;position:relative;overflow:hidden}
.quiz .pic>svg,.quiz .pic>canvas{position:absolute;inset:0;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:.6em;min-height:0}
.q{font-size:1.5em;font-weight:700;line-height:1.2;color:#2a2227}
.ctx{font-size:1.1em;line-height:1.25;color:#4a4046}
.opts{display:grid;gap:.55em;margin-top:auto}
.opt{font:inherit;font-size:1.25em;text-align:left;padding:.6em .9em;border-radius:.6em;border:.14em solid #b9a9b1;background:#fff;cursor:pointer;line-height:1.15;color:#2a2227}
.opt.ok{background:#e3f3e8;border-color:#2e7d4f;font-weight:700}
.opt.no{background:#fde8e6;border-color:#b3261e;opacity:.75}
.opt.dim{opacity:.45}
.prog{font-size:1em;color:#6b6066;font-weight:700}
.teams{display:flex;gap:.5em;flex-wrap:wrap}
.team{padding:.3em .8em;border-radius:.5em;background:#efecea;font-weight:700;font-size:1.05em;border:.14em solid transparent}
.team.cur{border-color:#8a1b46;background:#f6e9ef;color:#8a1b46}
/* order */
.order{display:flex;flex-direction:column;gap:.7em;height:100%}
.order .task{font-size:1.4em;font-weight:700;line-height:1.2}
.slots,.pool{display:grid;gap:.7em;flex:1;min-height:0}
.slot{border:.18em dashed #b9a9b1;border-radius:.7em;background:#faf7f8;position:relative;min-height:0;display:flex;align-items:stretch;justify-content:center;cursor:pointer}
.slot>b{position:absolute;left:.4em;top:.2em;font-size:1.3em;color:#8a1b46;z-index:2;background:rgba(255,255,255,.85);border-radius:.3em;padding:0 .3em}
.slot.ok{border:.22em solid #2e7d4f}.slot.no{border:.22em solid #b3261e}
.item{border-radius:.55em;background:#fff center/contain no-repeat;border:.16em solid #dcd7d3;cursor:grab;width:100%;min-height:0;position:relative;overflow:hidden}
.item.sel{border-color:#8a1b46;box-shadow:0 0 0 .2em #8a1b46}
.item>svg,.item>canvas,.item>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pool{background:#efecea;border-radius:.8em;padding:.6em}
.pool .cell{min-height:0;display:flex}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;text-align:center;padding:2em 12%}
.start h2{font-size:2.4em;color:#8a1b46}.start p{font-size:1.4em;line-height:1.3}
.row{display:flex;gap:.6em;align-items:center;justify-content:center;flex-wrap:wrap}

.stack .rw{flex-direction:column;align-items:stretch;gap:.2em}
.stack .rw i{width:100%;height:5.2em}
.stack .rw div{font-size:.78em}
</style></head><body>
